name: Docker

on:
  push:
    branches: [main]
    tags: ['phase-*', 'v*']
  pull_request:
  # Lets you run the build → smoke-test → publish from the Actions tab on
  # demand, without a push — useful for a first run or a manual re-publish.
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Build, smoke-test, and publish the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only what a publish needs; nothing here can write to the repo.
      packages: write

    env:
      # Publish from the canonical repository on a push to main or a tag, and on
      # a manual run from the Actions tab — but never for a pull request, whose
      # token cannot write packages and whose code is not trusted to be tagged
      # `latest`. Computed once so the login and push steps cannot drift apart.
      PUBLISH: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.repository_owner == 'rgfs-project' }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build once, load it into the local daemon so the smoke test runs the
      # exact image that would be published — not a rebuild.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the image is self-contained: the CLI creates an admin (so it was
      # bundled and its deps are present), the server boots (so production
      # node_modules are complete), and /api/health answers. Credentials here
      # are throwaway and confined to this job's temporary volume — no real
      # data, no secrets, nothing printed.
      - name: Smoke-test the image
        run: |
          set -euo pipefail
          docker volume create ci-data >/dev/null

          # First admin — password on stdin, never in the command line or logs.
          printf 'ci-smoke-password\n' | docker run -i --rm \
            -v ci-data:/data "$IMAGE:ci" \
            create-admin --username ci-admin --admin

          docker run -d --name chatui -v ci-data:/data -p 3001:3001 \
            -e NODE_ENV=production "$IMAGE:ci"

          # Wait for health, then fail loudly with logs if it never comes up.
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/health >/dev/null 2>&1; then
              echo "healthy after ${i}s"; ok=1; break
            fi
            sleep 1
          done
          if [ "${ok:-0}" != 1 ]; then
            echo "::error::container never became healthy"
            docker logs chatui || true
            exit 1
          fi

          # The canonical 404 shape, to confirm the API — not just a static file
          # server — is what answered.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/conversations)
          test "$code" = 401 || { echo "::error::expected 401, got $code"; exit 1; }

          docker rm -f chatui >/dev/null
          docker volume rm ci-data >/dev/null
          echo "image is self-contained and serves"

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
