# A complete, runnable deployment. `docker compose up` builds and starts the
# app with a persistent named volume for its data.
#
# The first admin is created once, against the same volume, before first use:
#   docker compose run --rm -i app create-admin --username alice --admin
#
# TLS: mount a cert and key and set the two variables, or terminate TLS at a
# proxy in front and leave them unset (see SECURITY.md).
services:
  app:
    build: .
    ports:
      - '3001:3001'
    volumes:
      - chatui-data:/data
      # - ./tls:/tls:ro
    environment:
      NODE_ENV: production
      PORT: '3001'
      DATA_DIR: /data
      # The provider. Point at a reachable llama.cpp; keep it https:// or on a
      # private network — a plaintext hop leaks the key and every message.
      LLAMA_BASE_URL: ${LLAMA_BASE_URL:-http://host.docker.internal:8080}
      # LLAMA_API_KEY: ${LLAMA_API_KEY:-}
      # TLS_CERT_FILE: /tls/cert.pem
      # TLS_KEY_FILE: /tls/key.pem
    restart: unless-stopped

    # The process needs no privileges beyond opening a socket above 1024 and
    # writing to its own volume, and it already runs as `node` rather than
    # root. Saying so here means a flaw in a dependency cannot reach for
    # anything more: `no-new-privileges` blocks a setuid binary from raising
    # privileges mid-container, and dropping every capability leaves nothing
    # to raise them to.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Shutdown is prompt — in-flight generations are cancelled and the
    # listener closed on SIGTERM — but the default 10s leaves no margin if a
    # slow disk is mid-write when the signal lands. Past this, Docker sends
    # SIGKILL, which is how a half-written file happens.
    stop_grace_period: 30s

    # One JSON line per request, and the default driver keeps every one of
    # them forever. On a long-lived deployment that is a disk that fills for
    # no reason anybody notices until it is full.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

volumes:
  chatui-data:
